name: Testes API DAC Bantads

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Subir infraestrutura
        run: docker compose up -d --build

      - name: Debug variáveis ms-auth
        run: docker compose exec ms-auth env | grep SPRING_MAIL

      - name: Aguardar serviços ficarem prontos
        run: |
          echo "Aguardando RabbitMQ..."
          timeout 60 bash -c 'until curl -s http://localhost:15672 > /dev/null; do sleep 2; done'

          echo "Aguardando Mailpit..."
          timeout 30 bash -c 'until curl -s http://localhost:8025/api/v1/messages > /dev/null; do sleep 1; done'

          echo "Aguardando API Gateway..."
          timeout 120 bash -c 'until curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; do sleep 3; done'

          echo "Aguardando ms-auth..."
          timeout 120 bash -c 'until curl -s http://localhost:8081/actuator/health > /dev/null 2>&1; do sleep 3; done'

          echo "Aguardando ms-gerente..."
          timeout 120 bash -c 'until curl -s http://localhost:8083/actuator/health > /dev/null 2>&1; do sleep 3; done'

          echo "Todos os serviços prontos!"

      - name: Redirecionar porta 8000 → 8080
        run: |
          sudo iptables -t nat -A OUTPUT -p tcp --dport 8000 -j REDIRECT --to-port 8080

      - name: Debug emails configurados
        run: |
          grep "EMAIL_AUTOCADASTRO" tests-externos/test_dac_bantads.py

      - name: Clonar repositório de testes
        run: git clone https://github.com/razeranthom/test_bantads.git tests-externos

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          cd tests-externos
          pip install -r requirements.txt

      - name: Configurar emails de teste
        run: |
          cd tests-externos
          sed -i 's/EMAIL_AUTOCADASTRO1 = ""/EMAIL_AUTOCADASTRO1 = "${{ secrets.EMAIL_AUTOCADASTRO1 }}"/' test_dac_bantads.py
          sed -i 's/EMAIL_AUTOCADASTRO2 = ""/EMAIL_AUTOCADASTRO2 = "${{ secrets.EMAIL_AUTOCADASTRO2 }}"/' test_dac_bantads.py

      - name: Copiar conftest para interceptar input de senha
        run: cp conftest.py tests-externos/conftest.py

      - name: Rodar testes
        run: |
          cd tests-externos
          pytest test_dac_bantads.py -v --tb=short -s

      - name: Debug Mailpit emails
        if: failure()
        run: |
          curl -s http://localhost:8025/api/v1/messages | python3 -m json.tool

      - name: Logs dos serviços em caso de falha
        if: failure()
        run: |
          echo "=== API Gateway ===" && docker compose logs api-gateway --tail=50
          echo "=== ms-auth ===" && docker compose logs ms-auth --tail=50
          echo "=== ms-gerente ===" && docker compose logs ms-gerente --tail=50
          echo "=== ms-cliente ===" && docker compose logs ms-cliente --tail=50
          echo "=== conta ===" && docker compose logs conta --tail=50
          echo "=== Mailpit ===" && docker compose logs mailpit --tail=20

      - name: Derrubar serviços
        if: always()
        run: docker compose down -v